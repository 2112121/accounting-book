name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

# GITHUB_TOKEN 只給讀取權限：部署到 live 頻道不需要寫入 repo。
# 沒寫這段的話會沿用 repo 預設權限（舊 repo 通常是全部可寫）。
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Action 一律鎖定 commit SHA，不用可被移動的 tag。
      # 部署步驟拿得到 FIREBASE_SERVICE_ACCOUNT，tag 若被改指向惡意 commit，
      # 金鑰就會外洩（2025 年 tj-actions/changed-files 事件即是如此）。
      # 升級時：gh api repos/<owner>/<repo>/commits/<tag> -q .sha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 不把 token 留在 .git/config，後續步驟（含 npm 套件的安裝腳本）讀不到
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: accounting-book-8c886
          # 鎖定 CLI 版本：預設是 latest，等於每次部署都在拿得到金鑰的環境裡
          # 執行當天最新下載的程式。15.34+ 會額外檢查 Service Usage API，
          # 需要 service account 有 Service Usage Consumer 角色才能升級。
          firebaseToolsVersion: 15.33.0
